version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: attriguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attriguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attriguard_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-attrition_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attriguard} -d ${POSTGRES_DB:-attrition_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attriguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attriguard}:${POSTGRES_PASSWORD:-attriguard_secure_pwd}@postgres:5432/${POSTGRES_DB:-attrition_db}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:80,http://localhost"
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: attriguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=/api

volumes:
  postgres_data:
